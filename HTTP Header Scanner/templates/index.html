<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔐 CYBER SCAN · SOC Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="cyber-container">
        <h1>
            <i class="fas fa-shield-halved"></i>
            <span>CYBER·SCAN</span>
            <span style="font-size: 0.9rem; background: #0a2a2a; padding: 0 18px; border-radius: 60px; border: 1px solid #2ad4c0; color: #80ddd0; margin-left: 8px;">
                <i class="fas fa-microchip"></i> SOC v2
            </span>
        </h1>

        <form action="/scan" method="post" class="scan-form">
            <input type="text" name="url" placeholder="https://example.com" required>
            <button type="submit"><i class="fas fa-radar"></i> SCAN</button>
        </form>

        <div class="footer-note">
            <span><i class="fas fa-lock"></i> encrypted · cyber dashboard</span>
            <span><i class="fas fa-code"></i> security headers analyzer</span>
        </div>
    </div>
</body>
</html>
