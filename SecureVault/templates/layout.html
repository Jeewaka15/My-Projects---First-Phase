<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecureVault</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>
    <div class="wrapper">
        <!-- Sidebar (fixed) -->
        <aside class="sidebar">
            <h3 class="logo">
                <i class="bi bi-shield-lock-fill"></i>
                <span>SecureVault</span>
            </h3>
            <hr>
            <a href="/dashboard" class="active">
                <i class="bi bi-grid-fill"></i>
                <span>Dashboard</span>
            </a>
            <a href="#accountsTable" onclick="document.getElementById('accountsTable').scrollIntoView({behavior:'smooth'})">
                <i class="bi bi-key-fill"></i>
                <span>Passwords</span>
            </a>
            <a href="#addForm" onclick="document.getElementById('addForm').scrollIntoView({behavior:'smooth'})">
                <i class="bi bi-plus-circle-fill"></i>
                <span>Add New</span>
            </a>
            <a href="#" onclick="document.querySelector('.stat-card').scrollIntoView({behavior:'smooth'})">
                <i class="bi bi-shield-check"></i>
                <span>Security</span>
            </a>
            <a href="#">
                <i class="bi bi-gear-fill"></i>
                <span>Settings</span>
            </a>
            <a href="/logout" class="logout">
                <i class="bi bi-box-arrow-right"></i>
                <span>Logout</span>
            </a>
        </aside>

        <!-- Main Content -->
        <main class="content">
            <nav class="topbar">
                <h4><i class="bi bi-cpu me-2"></i> Dashboard</h4>
                <input type="text" placeholder="🔍 Search accounts..." id="searchBox" class="form-control search-box">
            </nav>
            {% block content %}{% endblock %}
        </main>
    </div>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>

</html>
