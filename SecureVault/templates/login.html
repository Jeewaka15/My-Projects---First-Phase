<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecureVault Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #0b0f14;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-image: radial-gradient(circle at 20% 30%, #13202a 0%, #0b0f14 70%);
        }
        .login-card {
            background: rgba(20, 28, 38, 0.9);
            backdrop-filter: blur(12px);
            border: 1px solid #2a3d4a;
            border-radius: 40px;
            padding: 48px 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8), 0 0 40px rgba(0, 255, 200, 0.03);
            transition: 0.3s;
        }
        .login-card:hover {
            border-color: #2ef7d0;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8), 0 0 50px rgba(0, 255, 200, 0.06);
        }
        .login-card .logo {
            text-align: center;
            margin-bottom: 30px;
        }
        .login-card .logo i {
            font-size: 3.5rem;
            color: #3fe6c0;
            background: rgba(0, 255, 200, 0.06);
            padding: 16px;
            border-radius: 60px;
            border: 1px solid #1f8a7a;
        }
        .login-card .logo h2 {
            color: #d6edff;
            font-weight: 700;
            margin-top: 14px;
            font-size: 1.9rem;
            letter-spacing: -0.5px;
        }
        .login-card .logo p {
            color: #7f9eb8;
            font-size: 0.9rem;
        }
        .form-control-cyber {
            background: #1c2531;
            border: 1px solid #2f3d4b;
            color: #eef6ff;
            border-radius: 40px;
            padding: 14px 22px;
            font-weight: 500;
            transition: 0.2s;
        }
        .form-control-cyber:focus {
            background: #1b2532;
            border-color: #2ef7d0;
            box-shadow: 0 0 0 3px rgba(46, 247, 208, 0.15);
            color: white;
        }
        .form-control-cyber::placeholder {
            color: #6f8aa3;
        }
        .btn-cyber-primary {
            background: linear-gradient(145deg, #1fbd9e, #159e85);
            border: none;
            border-radius: 40px;
            font-weight: 600;
            padding: 14px 0;
            color: #0b141a;
            transition: 0.2s;
            letter-spacing: 0.3px;
            width: 100%;
            font-size: 1rem;
        }
        .btn-cyber-primary:hover {
            background: #26dbb8;
            transform: scale(1.02);
            box-shadow: 0 0 30px rgba(46, 247, 208, 0.25);
            color: #0b141a;
        }
        .error-msg {
            background: rgba(255, 70, 70, 0.08);
            border-left: 4px solid #ff6b6b;
            color: #f7b0b0;
            padding: 12px 18px;
            border-radius: 30px;
            font-size: 0.9rem;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .error-msg i {
            color: #ff6b6b;
            font-size: 1.3rem;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo">
            <i class="bi bi-shield-lock-fill"></i>
            <h2>SecureVault</h2>
            <p>🔐 master password required</p>
        </div>

        {% if error %}
        <div class="error-msg">
            <i class="bi bi-exclamation-triangle-fill"></i>
            {{ error }}
        </div>
        {% endif %}

        <form method="POST">
            <div class="mb-4">
                <input type="password" class="form-control form-control-cyber" name="password" placeholder="Enter master password" required>
            </div>
            <button type="submit" class="btn-cyber-primary">
                <i class="bi bi-unlock-fill me-2"></i> Unlock Vault
            </button>
        </form>

        <div class="text-center mt-4" style="color: #5b7a94; font-size: 0.8rem; border-top: 1px solid #1f2c38; padding-top: 20px;">
            <i class="bi bi-shield-check me-1"></i> AES-256 encrypted
        </div>
    </div>
</body>
</html>
